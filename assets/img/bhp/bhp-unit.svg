<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="BHP biogas engine-driven heat pump outdoor unit">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#e9eff3"/>
  </linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2f6f8"/><stop offset="1" stop-color="#dbe4ea"/>
  </linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c3d0d8"/><stop offset="1" stop-color="#aebec8"/>
  </linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e6edf1"/><stop offset="1" stop-color="#cfdae1"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12303f"/><stop offset="1" stop-color="#0c1a26"/>
  </linearGradient>
  <radialGradient id="fan" cx="0.4" cy="0.35" r="0.8">
    <stop offset="0" stop-color="#3d5361"/><stop offset="1" stop-color="#16262f"/>
  </radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0c1a26" flood-opacity=".18"/>
  </filter>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<ellipse cx="620" cy="712" rx="430" ry="34" fill="#0c1a26" opacity=".09"/>

<g filter="url(#sh)">
  <!-- skid -->
  <path d="M232 636 L792 636 L872 566 L872 606 L792 676 L232 676 Z" fill="#2b3d49"/>
  <rect x="232" y="636" width="560" height="40" fill="#24343f"/>
  <!-- body -->
  <path d="M240 320 L790 320 L790 640 L240 640 Z" fill="url(#front)"/>
  <path d="M790 320 L870 250 L870 570 L790 640 Z" fill="url(#side)"/>
  <path d="M240 320 L320 250 L870 250 L790 320 Z" fill="url(#top)"/>
  <!-- top fans -->
  <g>
    <ellipse cx="455" cy="286" rx="94" ry="32" fill="#9fb0ba"/>
    <ellipse cx="455" cy="283" rx="88" ry="29" fill="url(#fan)"/>
    <ellipse cx="455" cy="284" rx="60" ry="22" fill="none" stroke="#6f8794" stroke-width="3"/>
    <ellipse cx="455" cy="284" rx="30" ry="11" fill="none" stroke="#6f8794" stroke-width="2.5"/>
    <circle cx="455" cy="284" r="7" fill="#9fb0ba"/>
    <g stroke="#7f95a1" stroke-width="2.5" opacity=".9">
      <path d="M395 268 L515 300"/><path d="M405 254 L505 314"/><path d="M505 254 L405 314"/><path d="M515 268 L395 300"/>
    </g>
  </g>
  <g>
    <ellipse cx="690" cy="286" rx="94" ry="32" fill="#9fb0ba"/>
    <ellipse cx="690" cy="283" rx="88" ry="29" fill="url(#fan)"/>
    <ellipse cx="690" cy="284" rx="60" ry="22" fill="none" stroke="#6f8794" stroke-width="3"/>
    <ellipse cx="690" cy="284" rx="30" ry="11" fill="none" stroke="#6f8794" stroke-width="2.5"/>
    <circle cx="690" cy="284" r="7" fill="#9fb0ba"/>
    <g stroke="#7f95a1" stroke-width="2.5" opacity=".9">
      <path d="M630 268 L750 300"/><path d="M640 254 L740 314"/><path d="M740 254 L640 314"/><path d="M750 268 L630 300"/>
    </g>
  </g>
  <!-- top edge seams -->
  <path d="M240 320 L790 320" stroke="#b9c7d0" stroke-width="3"/>
  <path d="M790 320 L870 250" stroke="#b9c7d0" stroke-width="3"/>
  <!-- front: brand band -->
  <rect x="268" y="348" width="330" height="78" rx="8" fill="url(#panel)"/>
  <text x="292" y="402" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="2">BHP</text>
  <text x="430" y="383" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#8fe3c0">BIOGAS HEAT PUMP</text>
  <text x="430" y="405" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#c6d6df">GAS ENGINE DRIVEN</text>
  <!-- front louvers -->
  <g stroke="#b7c6d0" stroke-width="3">
    <path d="M268 446 L650 446"/><path d="M268 463 L650 463"/><path d="M268 480 L650 480"/><path d="M268 497 L650 497"/><path d="M268 514 L650 514"/><path d="M268 531 L650 531"/><path d="M268 548 L650 548"/><path d="M268 565 L650 565"/><path d="M268 582 L650 582"/>
  </g>
  <!-- service door seam + handle -->
  <path d="M670 338 L670 618" stroke="#b3c2cc" stroke-width="2.5"/>
  <rect x="686" y="470" width="10" height="46" rx="5" fill="#7f95a1"/>
  <!-- control panel -->
  <rect x="700" y="352" width="72" height="104" rx="7" fill="#20343f"/>
  <rect x="710" y="362" width="52" height="34" rx="4" fill="#7fe0b8"/>
  <text x="736" y="385" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" font-weight="700" fill="#0c1a26">RUN</text>
  <g fill="#8fa6b2">
    <circle cx="718" cy="415" r="5"/><circle cx="736" cy="415" r="5"/><circle cx="754" cy="415" r="5"/>
    <circle cx="718" cy="433" r="5"/><circle cx="736" cy="433" r="5"/><circle cx="754" cy="433" r="5"/>
  </g>
  <!-- side service panel -->
  <path d="M812 300 L850 266 L850 512 L812 546 Z" fill="none" stroke="#93a7b3" stroke-width="2.5"/>
  <g fill="#93a7b3">
    <circle cx="826" cy="330" r="4"/><circle cx="826" cy="500" r="4"/>
  </g>
  <!-- gas inlet -->
  <path d="M240 566 L150 566" stroke="#c9a227" stroke-width="16" stroke-linecap="round"/>
  <path d="M240 566 L150 566" stroke="#e8c453" stroke-width="9" stroke-linecap="round"/>
  <rect x="118" y="548" width="34" height="36" rx="6" fill="#33475a"/>
  <circle cx="135" cy="566" r="11" fill="#e8c453" stroke="#8a6d12" stroke-width="3"/>
  <path d="M135 548 L135 584" stroke="#8a6d12" stroke-width="3"/>
  <text x="104" y="612" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#48626f">97% CH₄</text>
  <!-- feet -->
  <rect x="258" y="676" width="44" height="14" fill="#1b2831"/>
  <rect x="726" y="676" width="44" height="14" fill="#1b2831"/>
  <!-- subtle reflections -->
  <path d="M240 320 L790 320 L790 640 L240 640 Z" fill="url(#front)" opacity=".0"/>
</g>

<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <text x="600" y="92" text-anchor="middle" font-size="30" font-weight="800" fill="#0c1a26">Biogas Heat Pump (BHP) outdoor unit</text>
  <text x="600" y="132" text-anchor="middle" font-size="19" fill="#48626f">Gas engine drives the compressor directly — no electric motor, no grid connection</text>
  <text x="600" y="742" text-anchor="middle" font-size="15" fill="#6b8492">Illustration — general arrangement. Actual enclosure, fan count and dimensions vary by model.</text>
</g>
</svg>
