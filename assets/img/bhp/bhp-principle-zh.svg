<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840" role="img" aria-label="BHP principle schematic">
<defs>
  <marker id="ag" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#0f7a52"/></marker>
  <marker id="ao" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#d97706"/></marker>
  <marker id="ab" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#2563eb"/></marker>
  <marker id="ak" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#1f3a4a"/></marker>
  <style>
    .t{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif}
    .h{font-size:15px;font-weight:700;fill:#0c1a26}
    .s{font-size:12.5px;fill:#48626f}
    .zone{fill:#ffffff;stroke:#dde5ea;stroke-width:1.5}
  </style>
</defs>
<rect width="1400" height="840" fill="#f7fafc"/>
<text x="50" y="58" class="t" font-size="28" font-weight="800" fill="#0c1a26">BHP 系统工作原理</text>
<text x="50" y="90" class="t" font-size="15" fill="#48626f">97% 甲烷沼气驱动小型燃气发动机，发动机直接带动压缩机；油厂有没有电，制冷都照常。</text>

<!-- fuel zone -->
<rect x="45" y="130" width="300" height="420" rx="16" class="zone"/>
<text x="65" y="163" class="t h">沼气提纯</text>
<text x="65" y="184" class="t s">97% CH₄ · 9.94 kWh/Nm³</text>
<rect x="95" y="215" width="150" height="250" rx="26" fill="#e8f5ee" stroke="#0f7a52" stroke-width="3"/>
<path d="M95 250 A75 40 0 0 1 245 250" fill="#d7efe2" stroke="#0f7a52" stroke-width="3"/>
<text x="170" y="345" text-anchor="middle" class="t" font-size="30" font-weight="800" fill="#0f7a52">97%</text>
<text x="170" y="372" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#0f7a52">CH₄</text>
<g stroke="#0f7a52" stroke-width="4" opacity=".7">
  <path d="M125 405 L215 405"/><path d="M135 425 L205 425"/><path d="M145 445 L195 445"/>
</g>
<!-- pipe to gas train -->
<path d="M245 470 L345 470" stroke="#0f7a52" stroke-width="10" marker-end="url(#ag)"/>
<text x="290" y="455" text-anchor="middle" class="t s">5–20 kPa</text>

<!-- gas train -->
<rect x="355" y="395" width="165" height="150" rx="14" fill="#ffffff" stroke="#0f7a52" stroke-width="3"/>
<text x="437" y="425" text-anchor="middle" class="t h">燃气阀组</text>
<text x="437" y="446" text-anchor="middle" class="t s">过滤 · 调压 · 切断阀</text>
<g fill="#e8f5ee" stroke="#0f7a52" stroke-width="2.5">
  <rect x="375" y="470" width="38" height="46" rx="5"/>
  <circle cx="437" cy="493" r="22"/>
  <rect x="468" y="478" width="36" height="30" rx="4"/>
</g>
<path d="M394 470 L394 516" stroke="#0f7a52" stroke-width="2.5"/>
<path d="M480 478 L480 508" stroke="#0f7a52" stroke-width="2.5"/>
<path d="M437 471 L437 515" stroke="#0f7a52" stroke-width="2.5" opacity=".6"/>
<!-- pipe to engine -->
<path d="M520 470 L595 470" stroke="#0f7a52" stroke-width="10" marker-end="url(#ag)"/>

<!-- engine -->
<rect x="605" y="300" width="210" height="250" rx="16" fill="#f2f6f8" stroke="#1f3a4a" stroke-width="3"/>
<text x="710" y="332" text-anchor="middle" class="t h">燃气发动机</text>
<g fill="#34495e">
  <rect x="628" y="350" width="34" height="52" rx="5"/>
  <rect x="670" y="350" width="34" height="52" rx="5"/>
  <rect x="712" y="350" width="34" height="52" rx="5"/>
  <rect x="754" y="350" width="34" height="52" rx="5"/>
  <rect x="620" y="405" width="180" height="80" rx="10"/>
</g>
<g fill="#8fa6b2">
  <rect x="634" y="392" width="16" height="14"/><rect x="676" y="392" width="16" height="14"/>
  <rect x="718" y="392" width="16" height="14"/><rect x="760" y="392" width="16" height="14"/>
</g>
<circle cx="660" cy="450" r="15" fill="#c9d5dd" stroke="#1f3a4a" stroke-width="3"/>
<circle cx="760" cy="450" r="15" fill="#c9d5dd" stroke="#1f3a4a" stroke-width="3"/>
<path d="M660 450 L760 450" stroke="#1f3a4a" stroke-width="6" stroke-dasharray="8 6"/>
<text x="710" y="512" text-anchor="middle" class="t s">直接驱动，不用电机</text>
<text x="710" y="534" text-anchor="middle" class="t" font-size="12" fill="#6b8492">Sanyo GHP platform</text>

<!-- shaft -->
<path d="M815 450 L865 450" stroke="#1f3a4a" stroke-width="16" stroke-linecap="round"/>
<path d="M815 450 L865 450" stroke="#48626f" stroke-width="7" stroke-linecap="round"/>
<text x="840" y="428" text-anchor="middle" class="t s">shaft</text>

<!-- compressor -->
<circle cx="910" cy="450" r="48" fill="#dfe9ef" stroke="#1f3a4a" stroke-width="3"/>
<path d="M910 450 m0 -26 a26 26 0 1 1 -18 44 a18 18 0 1 0 18 -44" fill="none" stroke="#2563eb" stroke-width="5"/>
<text x="910" y="528" text-anchor="middle" class="t h">压缩机</text>

<!-- hot gas to condenser -->
<path d="M910 402 L910 300 L1070 300" fill="none" stroke="#d97706" stroke-width="9" marker-end="url(#ao)"/>
<text x="975" y="285" text-anchor="middle" class="t s">hot gas</text>

<!-- condenser -->
<rect x="1080" y="225" width="270" height="150" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<text x="1215" y="252" text-anchor="middle" class="t h">冷凝器 / 室外换热器</text>
<text x="1215" y="272" text-anchor="middle" class="t s">热量排到空气</text>
<g stroke="#d97706" stroke-width="3">
  <path d="M1105 292 H1325"/><path d="M1105 310 H1325"/><path d="M1105 328 H1325"/><path d="M1105 346 H1325"/>
</g>
<g>
  <circle cx="1150" cy="292" r="27" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
  <circle cx="1215" cy="292" r="27" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
  <circle cx="1280" cy="292" r="27" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
  <g stroke="#d97706" stroke-width="2.5">
    <path d="M1130 292 H1170"/><path d="M1195 292 H1235"/><path d="M1260 292 H1300"/>
    <path d="M1150 272 V312"/><path d="M1215 272 V312"/><path d="M1280 272 V312"/>
  </g>
</g>

<!-- liquid line down to expansion valve -->
<path d="M1350 300 L1350 560 L1295 560" fill="none" stroke="#2563eb" stroke-width="9" marker-end="url(#ab)"/>
<!-- expansion valve -->
<path d="M1290 560 L1235 560" stroke="#2563eb" stroke-width="9"/>
<path d="M1258 538 L1272 582 L1244 582 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<path d="M1258 582 L1272 538 L1286 582 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="1265" y="612" text-anchor="middle" class="t h">膨胀阀</text>
<!-- evaporator -->
<rect x="980" y="520" width="240" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1100" y="550" text-anchor="middle" class="t h">蒸发器 / 室内换热器</text>
<text x="1100" y="570" text-anchor="middle" class="t s">输出冷量</text>
<g stroke="#2563eb" stroke-width="3">
  <path d="M1000 588 H1200"/><path d="M1000 604 H1200"/>
</g>
<!-- back to compressor -->
<path d="M980 575 L930 575 L930 498" fill="none" stroke="#2563eb" stroke-width="9" marker-end="url(#ab)"/>
<!-- to rooms -->
<path d="M1100 630 L1100 690" stroke="#2563eb" stroke-width="9" marker-end="url(#ab)"/>
<rect x="1010" y="698" width="180" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="1100" y="733" text-anchor="middle" class="t h">房间 / 冷库</text>

<!-- heat recovery -->
<path d="M710 550 L710 640" stroke="#d97706" stroke-width="9" marker-end="url(#ao)"/>
<rect x="615" y="648" width="190" height="90" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<text x="710" y="680" text-anchor="middle" class="t h">余热回收</text>
<text x="710" y="702" text-anchor="middle" class="t s">缸套水 + 烟气</text>
<path d="M805 692 L870 692" stroke="#d97706" stroke-width="9" marker-end="url(#ao)"/>
<rect x="878" y="655" width="150" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="953" y="688" text-anchor="middle" class="t h">60–90 ℃ 热水</text>
<text x="953" y="710" text-anchor="middle" class="t s">heat recovery (optional)</text>

<!-- banner -->
<rect x="45" y="772" width="1310" height="46" rx="10" fill="#0c1a26"/>
<text x="700" y="801" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#8fe3c0">传动链里没有电机——锅炉、汽轮机都停了，制冷仍在继续。</text>
<text x="700" y="130" text-anchor="middle" class="t" font-size="11.5" fill="#6b8492" opacity="0"> </text>
<text x="45" y="752" class="t" font-size="11.5" fill="#6b8492">示意图。燃气处理范围按提纯后的气质确定。</text>
</svg>
